<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
}


.title {
    font-family: 'Great Vibes', cursive;
    font-size: 70px;
    color: white;
    margin-bottom: 20px;
    text-align: center;
}


.btn-valentine {
    width: 140px;
    font-size: 18px;
    border-radius: 30px;
    padding: 10px;
    margin: 10px;
    font-family: 'Poppins', sans-serif;
}

#message {
    font-family: 'Poppins', sans-serif;
    font-size: 22px;
    margin-top: 20px;
    font-weight: 500;
    color: white;
}


.teddy {
    position: relative;
    width: 140px;
    height: 160px;
    margin-bottom: 20px;
    animation: float 3s ease-in-out infinite;
}


.head {
    width: 90px;
    height: 90px;
    background: #8b5a2b;
    border-radius: 50%;
    position: absolute;
    left: 25px;
    top: 0;
    z-index: 1;
}


.ear {
    width: 35px;
    height: 35px;
    background: #8b5a2b;
    border-radius: 50%;
    position: absolute;
    z-index: 0;
}

.ear.left {
    top: -10px;
    left: 10px;
}

.ear.right {
    top: -10px;
    right: 10px;
}

.eye {
    width: 14px;
    height: 14px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 35px;
    z-index: 2;
}

.eye::after {
    content: "";
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
}

.eye.left {
    left: 50px;
}

.eye.right {
    right: 50px;
}

.nose {
    width: 16px;
    height: 12px;
    background: #3b2a1a;
    border-radius: 50%;
    position: absolute;
    top: 52px;
    left: 62px;
    z-index: 2;
}

.heart {
    position: absolute;
    top: 90px;
    left: 45px;
    width: 50px;
    height: 50px;
    background: #ff4d6d;
    transform: rotate(-45deg);
    animation: heartbeat 1.2s infinite;
}

.heart::before,
.heart::after {
    content: "";
    width: 50px;
    height: 50px;
    background: #ff4d6d;
    border-radius: 50%;
    position: absolute;
}

.heart::before {
    top: -25px;
    left: 0;
}

.heart::after {
    left: 25px;
    top: 0;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes heartbeat {
    0%,100% { transform: scale(1) rotate(-45deg); }
    50% { transform: scale(1.2) rotate(-45deg); }
}


</style>
</head>

<body>

<div class="teddy">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="nose"></div>

    <div class="heart"></div>
</div>


<h1 class="title">Will You Be My Valentine?</h1>

<div>
    <button class="btn btn-danger btn-valentine" onclick="sayYes()">YES ❤️</button>
    <button class="btn btn-secondary btn-valentine" id="noBtn">NO 😢</button>
</div>

<div id="message"></div>

<script>

function sayYes() {
    document.getElementById("message").innerHTML =
        "See you sa Feb 14 baby Reona, MWAPSSSSS!!!!!💖🥺";
}

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 150);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

</script>

</body>
</html>
